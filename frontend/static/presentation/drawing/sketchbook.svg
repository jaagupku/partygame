<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <!-- Original Drawing Mashup sketchbook: open spiral pad, taped doodles and a pencil. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Page shadows and paper -->
    <path d="M118 48 L352 40 L356 268 L122 274 Z" fill="#1d2b53" opacity="0.08" transform="translate(6 7)"/>
    <path d="M368 40 L602 48 L598 274 L364 268 Z" fill="#1d2b53" opacity="0.08" transform="translate(6 7)"/>
    <path d="M118 48 L352 40 L356 268 L122 274 Z" fill="#ffffff" stroke="#1d2b53" stroke-width="3"/>
    <path d="M368 40 L602 48 L598 274 L364 268 Z" fill="#ffffff" stroke="#1d2b53" stroke-width="3"/>
    <!-- Faint ruled guide lines -->
    <g stroke="#c9cfdc" stroke-width="1.5">
      <path d="M140 90 L338 84"/><path d="M141 130 L339 124"/><path d="M142 170 L340 164"/><path d="M143 210 L341 204"/>
      <path d="M382 84 L580 90"/><path d="M381 124 L579 130"/><path d="M380 164 L578 170"/><path d="M379 204 L577 210"/>
    </g>
    <!-- Spiral binding -->
    <g stroke="#1d2b53" stroke-width="3">
      <path d="M352 62 c10 -8 16 -2 16 6"/><path d="M353 92 c10 -8 16 -2 16 6"/><path d="M353 122 c10 -8 16 -2 16 6"/>
      <path d="M354 152 c10 -8 16 -2 16 6"/><path d="M354 182 c10 -8 16 -2 16 6"/><path d="M355 212 c10 -8 16 -2 16 6"/>
      <path d="M355 242 c10 -8 16 -2 16 6"/>
    </g>
    <!-- Left page: a wobbly house, sun and cloud -->
    <g stroke="#2a4a9b" stroke-width="4">
      <path d="M170 220 L172 152 L214 116 L258 150 L256 220 Z"/>
      <path d="M200 220 L201 184 L226 183 L227 220"/>
      <path d="M236 160 h12 v14 h-13 z"/>
      <circle cx="300" cy="96" r="20"/>
      <path d="M300 64 v-10 M326 74 l8 -7 M332 98 h11 M274 74 l-8 -7 M268 98 h-11"/>
      <path d="M160 92 c4 -14 22 -14 26 -4 c6 -10 24 -6 22 8 c8 2 6 14 -4 14 h-40 c-10 0 -12 -14 -4 -18 z"/>
    </g>
    <path d="M176 236 c30 -6 50 6 80 0 s40 -6 60 2" stroke="#f26b5b" stroke-width="4"/>
    <!-- Right page: a grinning cat and a star burst -->
    <g stroke="#2a4a9b" stroke-width="4">
      <path d="M420 200 c-6 -50 20 -78 58 -78 s64 28 58 78 c-4 26 -112 26 -116 0 z"/>
      <path d="M426 140 l4 -38 l28 24 M532 140 l-4 -38 l-28 24"/>
      <circle cx="456" cy="164" r="5" fill="#2a4a9b"/><circle cx="502" cy="164" r="5" fill="#2a4a9b"/>
      <path d="M462 190 c10 10 26 10 34 0"/>
      <path d="M430 182 l-24 -4 M430 192 l-22 6 M528 182 l24 -4 M528 192 l22 6"/>
    </g>
    <path d="M556 88 l6 14 l15 2 l-11 10 l3 15 l-13 -8 l-13 8 l3 -15 l-11 -10 l15 -2 z" fill="#ffd23f" stroke="#1d2b53" stroke-width="3"/>
    <path d="M400 236 c18 -10 34 10 52 0 s34 10 52 0 s34 10 52 0" stroke="#f26b5b" stroke-width="4"/>
    <!-- Tape strips -->
    <path d="M126 40 l52 -8 l4 20 l-52 8 z" fill="#f26b5b" opacity="0.55"/>
    <path d="M548 34 l52 10 l-4 20 l-52 -10 z" fill="#f26b5b" opacity="0.55"/>
    <!-- Pencil -->
    <g transform="rotate(-24 620 230)">
      <rect x="560" y="218" width="120" height="22" rx="3" fill="#ffd23f" stroke="#1d2b53" stroke-width="3"/>
      <path d="M560 218 l-30 11 l30 11 z" fill="#fde7e1" stroke="#1d2b53" stroke-width="3"/>
      <path d="M530 229 l10 -4 v8 z" fill="#1d2b53"/>
      <rect x="680" y="218" width="20" height="22" rx="4" fill="#f26b5b" stroke="#1d2b53" stroke-width="3"/>
      <path d="M574 229 h96" stroke="#1d2b53" stroke-width="2" opacity="0.4"/>
    </g>
    <!-- Loose doodles -->
    <path d="M60 120 c12 -16 28 16 40 0 s28 16 40 0" stroke="#2a4a9b" stroke-width="3"/>
    <path d="M70 200 l10 10 m0 -10 l-10 10" stroke="#f26b5b" stroke-width="4"/>
    <path d="M650 110 c0 -14 22 -14 22 0 s-22 14 -22 0" stroke="#f26b5b" stroke-width="3"/>
  </g>
</svg>
