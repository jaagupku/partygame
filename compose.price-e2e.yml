# Always use the dedicated project name in scripts/test-price-browser.sh.
services:
  api:
    environment:
      POSTGRES_DB: partygame_price_e2e
  postgres:
    environment:
      POSTGRES_DB: partygame_price_e2e
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partygame -d partygame_price_e2e"]
  valkey:
    ports: !reset []
  gateway:
    ports: !override ["127.0.0.1:${PRICE_E2E_PORT:-18080}:80"]
  price-scheduler:
    profiles: ["disabled-in-browser-tests"]
