---
services:
  api:
    build:
      context: ./api
      target: development
    environment:
      - VALKEY_HOST=valkey
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=partygame
      - POSTGRES_USER=partygame
      - POSTGRES_PASSWORD=partygame
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123
      - ADMIN_DISPLAY_NAME=Demo Admin
      - WATCHFILES_FORCE_POLLING=true
      - MEDIA_ROOT=/app/media
    volumes:
      - ./api/partygame:/app/partygame:ro
      - ./api/alembic:/app/alembic:ro
      - ./api/alembic.ini:/app/alembic.ini:ro
      - ./api/games:/app/games:ro
      - ./api/media_seed:/app/media_seed:ro
      - ./api/tests:/app/tests:ro
      - api-media:/app/media
    depends_on:
      valkey:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  price-scheduler:
    build:
      context: ./api
      target: development
    command: ["python", "-m", "partygame.service.prices.refresh", "--schedule"]
    environment:
      - VALKEY_HOST=valkey
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=partygame
      - POSTGRES_USER=partygame
      - POSTGRES_PASSWORD=partygame
      - MEDIA_ROOT=/app/media
    volumes:
      - ./api/partygame:/app/partygame:ro
      - api-media:/app/media
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      - DEV_API_TARGET=http://api:8000
      - DEV_USE_POLLING=true
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/static:/app/static:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/svelte.config.js:/app/svelte.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/vitest.config.ts:/app/vitest.config.ts:ro
      - ./frontend/.prettierrc:/app/.prettierrc:ro
      - ./frontend/.prettierignore:/app/.prettierignore:ro
      - ./frontend/.eslintrc.cjs:/app/.eslintrc.cjs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  gateway:
    build:
      context: ./gateway
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${DEV_PORT:-80}:80"

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=partygame
      - POSTGRES_USER=partygame
      - POSTGRES_PASSWORD=partygame
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partygame -d partygame"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  api-media:
